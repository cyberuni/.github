name: pnpm-verify
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node-version:
        type: string
        required: false
        default: '["lts/-1", "lts/*"]'
      pnpm-version:
        type: string
        required: false
      skip-codecov:
        type: boolean
        required: false
        default: false
      # Which matrix leg uploads coverage. Defaults to `lts/*` so it tracks whatever the
      # current LTS is, rather than naming a Node version that goes stale — a pinned
      # number is what broke this step before (see the codecov step).
      #
      # If a caller's `node-version` matrix contains no `lts/*`, set this to one of the
      # values it does contain, or nothing uploads.
      codecov-node-version:
        type: string
        required: false
        default: 'lts/*'
      skip-playwright:
        type: boolean
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
        description: >-
          Codecov upload token. Set it once as a cyberuni org secret and pass
          `secrets: inherit` from the caller. Optional so a caller using
          `skip-codecov: true` needs no secret at all.

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg. With fail-fast on, the first failure cancels the others and
      # they report "The operation was canceled" with no error of their own — which hides
      # which legs are actually broken and sends you reading the wrong log.
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        node-version: ${{ fromJson(inputs.node-version) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cyberuni/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      # Only Linux runners need a virtual display, and only when there are browsers to
      # drive. This previously ran unconditionally, before checkout, on all three OSes —
      # `Xvfb` does not exist on the macOS or Windows images, so those legs were doing
      # nothing useful (they stayed green because the trailing `&` backgrounds it).
      - name: Start X Virtual Frame Buffer
        if: runner.os == 'Linux' && inputs.skip-playwright == false
        run: echo "DISPLAY=:99.0" >> $GITHUB_ENV && Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Cache Playwright Browsers
        if: inputs.skip-playwright == false
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install playwright browsers
        if: inputs.skip-playwright == false
        run: pnpx playwright install --with-deps chromium

      - name: Install Dependencies
        run: pnpm install

      - name: Verify
        run: pnpm verify

      # Upload once, from the Linux leg running `codecov-node-version` (default `lts/*`).
      #
      # This condition used to read `matrix.node-version == 18`, which could never be
      # true against the default matrix of `["lts/-1", "lts/*"]` — so coverage was
      # silently never uploaded for any repo taking the defaults. Pinning a Node number
      # here is the bug; an `lts/*` alias tracks the matrix instead of going stale.
      #
      # `skip-codecov: true` remains the way to opt out.
      #
      # The token is REQUIRED. Codecov rejects tokenless uploads from this org with
      # `Token required - not valid tokenless upload`, and `codecov-action` reports that
      # rejection as a SUCCESSFUL step — so without it the job is green and nothing is
      # uploaded. Proven on cyberuni/color-map#214.
      #
      # `fail_ci_if_error` stays false on purpose: coverage must never gate a merge
      # (see the board's `reference: secretless release approach` §15), so a Codecov
      # outage must not fail `verify` and therefore `code / all-checks`. The badge is its
      # own monitor — if uploads stop, the README badge goes stale and that is the signal.
      # Do not read a green `codecov` step as proof that an upload landed; read the log.
      - name: codecov
        if: inputs.skip-codecov == false && matrix.os == 'ubuntu-latest' && matrix.node-version == inputs.codecov-node-version
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  all-checks:
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            exit 1
          fi
