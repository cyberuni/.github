name: pnpm-release-changeset
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        # Pinned rather than an `lts/*` alias: alias resolution fetches the
        # Node versions manifest, which has intermittently returned a
        # non-array and failed the job with "manifest.filter is not a function".
        default: '22'
      pnpm-version:
        type: string
        required: false
      skip-playwright:
        type: boolean
        required: false
        default: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}
permissions:
  id-token: write
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        if: inputs.skip-playwright == false
        uses: cyberuni/.github/.github/actions/setup-playwright@main

      - name: Install npm with OIDC trusted publishing support
        run: npm install -g npm@11

      - run: pnpm build

      # changesets/action v2 is the release matched to @changesets/cli v3, which every
      # caller now needs: npm 12 changed `npm info --json` to emit an array, and cli 2.x
      # reads `.versions` straight off the parsed object. It comes back undefined, every
      # version looks unpublished, and the release republishes into npm's E403
      # "You cannot publish over the previously published versions".
      #
      # v2 renamed the inputs (version -> version-script, publish -> publish-script,
      # commit -> commit-message) and dropped the GITHUB_TOKEN *env var* in favour of the
      # github-token *input*. The old names are silently ignored, so a half-done bump
      # leaves the action running with no publish script at all.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.0
        with:
          commit-message: 'chore: version packages'
          version-script: pnpm run version
          publish-script: pnpm run release
          github-token: ${{ secrets.CI_GITHUB_TOKEN }}

      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"
