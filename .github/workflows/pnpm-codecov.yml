name: pnpm-codecov
on:
  workflow_call:
    inputs:
      flags:
        type: string
        required: false
      files:
        type: string
        required: false
      node-version:
        type: string
        required: false
        default: '20'
      pnpm-version:
        type: string
        required: false
jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - run: pnpm coverage

      - name: codecov
        uses: codecov/codecov-action@v7
        # A coverage upload must never fail CI: the tests are the gate.
        continue-on-error: true
        with:
          files: ${{ inputs.files }}
          flags: ${{ inputs.flags }}
