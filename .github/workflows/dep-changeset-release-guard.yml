name: dep-changeset-release-guard
# P9: the release-time backstop for the dep-changeset gate. On the changesets
# "Version Packages" PR, fails when a package's major version goes up and no
# person-written changeset among those the PR consumes asked for `major`.
#
# A major can reach the release without a person choosing it in two ways the PR-time
# gate does not see:
#   - a bot-written changeset with `major`, from a repo still on the old per-repo
#     renovate-changeset.yml that copied Renovate's update type into the level.
#   - changesets itself raising a dependent to major, for example when a workspace
#     peer dependency range no longer covers the new version.
# Packages in a `fixed` or `linked` group of .changeset/config.json pass when another
# member of the group has a person-written major.
#
# "Person-written" means a commit that added or edited the changeset came from a person.
# Squash merges make the merged commit's author the PR author (renovate[bot] for a
# Renovate PR), so the guard looks up the PR each commit came from and checks that PR's
# own commits. It needs `pull-requests: read` for that; without it, it falls back to the
# git author, which fails closed on a squash-merged person commit.
#
# Call it from the CI workflow that runs on `pull_request`. Every job is skipped on
# PRs whose head branch does not start with `release-branch-prefix`, so the caller
# needs no `if:`. The Version Packages PR's runs must actually execute: the
# pnpm-release-changeset-oidc workflow approves them; see its header.
on:
  workflow_call:
    inputs:
      release-branch-prefix:
        type: string
        required: false
        default: changeset-release/
      tools-ref:
        description: The cyberuni/.github ref to load the scripts from.
        type: string
        required: false
        default: main

jobs:
  guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, inputs.release-branch-prefix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: cyberuni/.github
          ref: ${{ inputs.tools-ref }}
          path: .dep-changeset-tools
          persist-credentials: false

      - name: Install the dep-changeset tools
        run: |
          set -euo pipefail
          mv .dep-changeset-tools "$RUNNER_TEMP/dep-changeset-tools"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/dep-changeset-tools/.github/scripts/dep-changeset"

      - name: Check major bumps
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node "$RUNNER_TEMP/dep-changeset-tools/.github/scripts/dep-changeset/cli.mjs" release-guard
