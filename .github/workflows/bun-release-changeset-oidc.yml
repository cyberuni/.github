name: bun-release-changeset-oidc
# Secretless variant of bun-release-changeset.yml.
#
# Differences from that workflow:
#   - No CI_GITHUB_TOKEN. The "version packages" PR is opened with a repobuddy GitHub
#     App token when the caller passes RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. A PR
#     opened with GITHUB_TOKEN does not trigger `on: pull_request` workflows, so its
#     required checks never report and it can only be merged by an admin; the app token
#     does trigger them. An app key does not expire, so there is still nothing to rotate.
#     Without those secrets the job falls back to the built-in GITHUB_TOKEN with elevated
#     `permissions`, and the org must allow GitHub Actions to create pull requests.
#   - No NPM_TOKEN, and no hand-written .npmrc. Publishes via npm trusted publishing
#     (OIDC), which also emits provenance attestations. Each package needs a trusted
#     publisher registered at npmjs.com/package/<name>/access naming the repo and the
#     *caller* workflow's filename (release.yml), not this file.
#
# WHY OIDC WORKS HERE, EVEN THOUGH `bun publish` DOES NOT SUPPORT IT:
#
# changesets does not publish with the package manager it installed with. Its
# getPublishTool() returns pnpm only when pnpm is detected, and `{name: "npm"}` for
# everything else — bun included. So `changeset publish` shells out to `npm publish`, and
# the OIDC exchange happens inside the npm CLI, which does support trusted publishing.
# Verified against @changesets/cli 2.31.1.
#
# The consequence is that npm, not bun, must be current: the "Ensure npm supports trusted
# publishing" step below is load-bearing, not boilerplate.
#
# Deliberately NO `registry-url` on setup-node, as in every other -oidc workflow here.
# With it, setup-node writes an .npmrc containing
# `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` that a secretless run can never
# fill in, and the tooling sees an auth directive it cannot satisfy instead of reaching
# the OIDC exchange (semantic-release/npm#1069).
#
# The playwright and vsce steps from bun-release-changeset.yml are intentionally absent.
# They serve repos that need a browser or publish a VS Code extension; a repo needing
# them should add them to its own caller or ask for a variant.
#
# cyberuni has an org secret scope, so the argument here is not "there is nowhere to put a
# token". It is that CI_GITHUB_TOKEN and NPM_TOKEN are long-lived credentials that expire
# silently: an expired NPM_TOKEN is what left color-map not publishing for three months
# without anyone noticing. OIDC credentials are minted per run and last minutes.
#
# cyberuni has no other bun workflows; a repo using this should keep its `code` job
# pointed at unional/.github's bun-verify.yml, which is public and has an all-checks job.
#
# Mirrors unional/.github's workflow of the same name. The executable YAML is identical
# except for the optional release-app token (secrets, app-token step, and the two token
# inputs that use it), which only this copy has. Change both or neither.
on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        required: false
      node-version:
        type: string
        required: false
        default: lts/*
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

permissions:
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  id-token: write
  # Lets changesets/action push the version branch and tags. bun-release-changeset.yml
  # declares `contents: read` because its pushes went out under CI_GITHUB_TOKEN instead.
  contents: write
  # Lets changesets/action open the "version packages" PR.
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The version branch is pushed with the checkout's credentials, so the app token
      # goes here too; otherwise the push would not re-trigger the PR's checks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # Load-bearing: changesets publishes through the npm CLI (see header), and trusted
      # publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: bun install

      - run: bun run build

      # changesets/action v2 is the release matched to @changesets/cli v3, which every
      # caller now needs: npm 12 changed `npm info --json` to emit an array, and cli 2.x
      # reads `.versions` straight off the parsed object. It comes back undefined, every
      # version looks unpublished, and the release republishes into npm's E403
      # "You cannot publish over the previously published versions".
      #
      # v2 renamed the inputs (version -> version-script, publish -> publish-script,
      # commit -> commit-message) and dropped the GITHUB_TOKEN *env var* in favour of the
      # github-token *input*. The old names are silently ignored, so a half-done bump
      # leaves the action running with no publish script at all.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'chore: version packages'
          version-script: bun run version
          publish-script: bun run release
