name: bun-release-changeset-oidc
# Secretless variant of bun-release-changeset.yml.
#
# Differences from that workflow:
#   - No CI_GITHUB_TOKEN. Checkout and changesets/action both use the built-in
#     GITHUB_TOKEN with the caller's grant. GitHub starts no workflows for events
#     that token causes, so opening or pushing the "version packages" PR does not run
#     the caller's `on: pull_request` CI, and a ruleset that requires its checks leaves
#     the PR blocked. workflow_dispatch is the one event GITHUB_TOKEN may trigger, so
#     after changesets/action opens or updates the PR, this job runs
#     `gh workflow run <ci-workflow> --ref changeset-release/<branch>`. The check runs
#     from that dispatch attach to the branch head under the GitHub Actions app and
#     satisfy the required check by name. A GitHub App token would also work, but it
#     means a long-lived private key in org secrets; this needs no stored secret.
#
#     The caller must:
#       - grant `id-token: write`, `contents: write` and `pull-requests: write` to
#         the job that calls this workflow, plus `actions: write` for the dispatch.
#         This workflow declares no `permissions:` of its own, so the caller's grant
#         passes through unchanged. A block here would cap the token: every scope it
#         did not list, `actions` included, would drop to `none`, and the dispatch
#         would fail with 403 even when the caller grants `actions: write`. Listing
#         `actions: write` here instead would break every caller that does not grant
#         it, since a called workflow may not request more than its caller grants;
#       - list `workflow_dispatch:` in the `on:` block of its CI workflow
#         (`ci-workflow`, default pull-request.yml). Without it the dispatch fails; the
#         release still succeeds, but with a warning and a PR that has no checks.
#   - No NPM_TOKEN, and no hand-written .npmrc. Publishes via npm trusted publishing
#     (OIDC), which also emits provenance attestations. Each package needs a trusted
#     publisher registered at npmjs.com/package/<name>/access naming the repo and the
#     *caller* workflow's filename (release.yml), not this file.
#
# WHY OIDC WORKS HERE, EVEN THOUGH `bun publish` DOES NOT SUPPORT IT:
#
# changesets does not publish with the package manager it installed with. Its
# getPublishTool() returns pnpm only when pnpm is detected, and `{name: "npm"}` for
# everything else — bun included. So `changeset publish` shells out to `npm publish`, and
# the OIDC exchange happens inside the npm CLI, which does support trusted publishing.
# Verified against @changesets/cli 2.31.1.
#
# The consequence is that npm, not bun, must be current: the "Ensure npm supports trusted
# publishing" step below is load-bearing, not boilerplate.
#
# Deliberately NO `registry-url` on setup-node, as in every other -oidc workflow here.
# With it, setup-node writes an .npmrc containing
# `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` that a secretless run can never
# fill in, and the tooling sees an auth directive it cannot satisfy instead of reaching
# the OIDC exchange (semantic-release/npm#1069).
#
# The playwright and vsce steps from bun-release-changeset.yml are intentionally absent.
# They serve repos that need a browser or publish a VS Code extension; a repo needing
# them should add them to its own caller or ask for a variant.
#
# cyberuni has an org secret scope, so the argument here is not "there is nowhere to put a
# token". It is that CI_GITHUB_TOKEN and NPM_TOKEN are long-lived credentials that expire
# silently: an expired NPM_TOKEN is what left color-map not publishing for three months
# without anyone noticing. OIDC credentials are minted per run and last minutes.
#
# cyberuni has no other bun workflows; a repo using this should keep its `code` job
# pointed at unional/.github's bun-verify.yml, which is public and has an all-checks job.
#
# Mirrors unional/.github's workflow of the same name. The executable YAML is identical
# except that only this copy has the `ci-workflow` input and the CI dispatch step, and
# declares no top-level `permissions:`. Change both or neither.
on:
  workflow_call:
    inputs:
      ci-workflow:
        description: >
          The caller's CI workflow file, dispatched on the version branch after the
          "version packages" PR is opened or updated. It must list `workflow_dispatch:`.
        type: string
        required: false
        default: pull-request.yml
      bun-version:
        type: string
        required: false
      node-version:
        type: string
        required: false
        default: lts/*
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # Load-bearing: changesets publishes through the npm CLI (see header), and trusted
      # publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: bun install

      - run: bun run build

      # changesets/action v2 is the release matched to @changesets/cli v3, which every
      # caller now needs: npm 12 changed `npm info --json` to emit an array, and cli 2.x
      # reads `.versions` straight off the parsed object. It comes back undefined, every
      # version looks unpublished, and the release republishes into npm's E403
      # "You cannot publish over the previously published versions".
      #
      # v2 renamed the inputs (version -> version-script, publish -> publish-script,
      # commit -> commit-message) and dropped the GITHUB_TOKEN *env var* in favour of the
      # github-token *input*. The old names are silently ignored, so a half-done bump
      # leaves the action running with no publish script at all.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.0
        with:
          commit-message: 'chore: version packages'
          version-script: bun run version
          publish-script: bun run release

      # GITHUB_TOKEN-caused events start no workflows, so the version PR would never get
      # its required checks. Dispatch the caller's CI on the version branch instead; see
      # the header. A failed dispatch warns rather than failing an otherwise good release.
      - name: Start CI on the version packages PR
        if: steps.changesets.outputs.pr-number != '' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          if ! out=$(gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERSION_BRANCH" 2>&1); then
            echo "$out"
            if grep -qi 'workflow_dispatch' <<<"$out"; then
              echo "::warning::$CI_WORKFLOW has no workflow_dispatch trigger, so the version packages PR has no checks. Add 'workflow_dispatch:' to its 'on:' block."
            elif grep -qiE '403|Resource not accessible' <<<"$out"; then
              echo "::warning::GITHUB_TOKEN may not dispatch $CI_WORKFLOW, so the version packages PR has no checks. Grant 'actions: write' in the caller's 'permissions:' for the job that calls this workflow."
            else
              echo "::warning::Could not dispatch $CI_WORKFLOW on $VERSION_BRANCH, so the version packages PR has no checks. Check that the caller grants 'actions: write' and that ci-workflow names its CI workflow file."
            fi
          fi
